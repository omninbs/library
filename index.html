<!doctype html>
<html>

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

  <title>OmniNBS Library</title>
  <meta name="description" content="A cluttered document website that looks like a dump.">
  <link rel="stylesheet" href="//cdn.jsdelivr.net/npm/docsify@5/dist/themes/core.min.css">
  <link rel="stylesheet" href="_assets/catppuccin-latte.css" media="(prefers-color-scheme: light)">
  <link rel="stylesheet" href="_assets/catppuccin-mocha.css" media="(prefers-color-scheme: dark)">
  <link rel="icon" href="_assets/favicon.svg" type="image/svg+xml">

  <!-- Configuration -->
  <script>
    window.$docsify = {
      name: 'OmniNBS Library',
      repo: 'https://github.com/omninbs/library',
      homepage: 'README.md',

      // sidebar
      auto2top: true,
      loadSidebar: true,
      // request
      requestHeaders: {
        'cache-control': 'no-cache',
      },
    };
  </script>

  <!-- Docsify.js -->
  <script src="//cdn.jsdelivr.net/npm/docsify@5/dist/plugins/search.min.js"></script>
  <script src="//cdn.jsdelivr.net/npm/docsify@5" defer></script>
</head>

<body class="loading">
  <div id="app"></div>
</body>

</html>
